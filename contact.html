<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact — Daniel Buades</title>

    <link rel="stylesheet" href="./contact.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap"
        rel="stylesheet"
    >
</head>

<body>

<header>

    <a class="brand" href="index.html">
        Daniel Buades
    </a>

    <nav aria-label="Main navigation">
        <a href="biography.html">Biography</a>
        <a href="videos.html">Videos</a>
        <a href="gallery.html">Gallery</a>
        <a href="concerts.html">Concerts</a>
        <a href="contact.html" class="active">Contact</a>
    </nav>

    <div class="header-right">

        <div class="socials" aria-label="Social networks">

            <!-- Instagram -->
            <a href="#" aria-label="Instagram">
                <svg viewBox="0 0 24 24">
                    <rect
                        x="3.2"
                        y="3.2"
                        width="17.6"
                        height="17.6"
                        rx="5">
                    </rect>

                    <circle
                        cx="12"
                        cy="12"
                        r="4.1">
                    </circle>

                    <circle
                        class="fill-icon"
                        cx="17.5"
                        cy="6.7"
                        r="1.1">
                    </circle>
                </svg>
            </a>

            <!-- Spotify -->
            <a href="#" aria-label="Spotify">
                <svg class="fill-icon" viewBox="0 0 24 24">

                    <circle cx="12" cy="12" r="11"></circle>

                    <path
                        d="M7 9.1c3.8-1.1 7.5-.8 10.5.4"
                        stroke="#111"
                        stroke-width="1.5"
                        fill="none"
                        stroke-linecap="round">
                    </path>

                    <path
                        d="M7.7 12c3.1-.8 6.3-.5 8.8.5"
                        stroke="#111"
                        stroke-width="1.5"
                        fill="none"
                        stroke-linecap="round">
                    </path>

                    <path
                        d="M8.5 14.8c2.4-.5 4.8-.3 6.7.5"
                        stroke="#111"
                        stroke-width="1.5"
                        fill="none"
                        stroke-linecap="round">
                    </path>

                </svg>
            </a>

            <!-- Facebook -->
            <a href="#" aria-label="Facebook">
                <svg class="fill-icon" viewBox="0 0 24 24">

                    <path
                        d="M13.8 21v-8h2.7l.4-3h-3.1V8.1c0-.9.3-1.5 1.6-1.5h1.7V3.9c-.3 0-1.3-.1-2.4-.1-2.4 0-4.1 1.5-4.1 4.2V10H8v3h2.6v8h3.2z">
                    </path>

                </svg>
            </a>

            <!-- YouTube -->
            <a href="#" aria-label="YouTube">
                <svg class="fill-icon" viewBox="0 0 24 24">

                    <path
                        d="M22 7.2c-.2-1.1-1.1-2-2.2-2.2C18 4.7 15.1 4.5 12 4.5s-6 .2-7.8.5C3.1 5.2 2.2 6.1 2 7.2c-.3 1.5-.4 3-.4 4.8s.1 3.3.4 4.8c.2 1.1 1.1 2 2.2 2.2 1.8.3 4.7.5 7.8.5s6-.2 7.8-.5c1.1-.2 2-1.1 2.2-2.2.3-1.5.4-3 .4-4.8s-.1-3.3-.4-4.8zM10 15.5v-7l6 3.5-6 3.5z">
                    </path>

                </svg>
            </a>

        </div>

        <a class="home-btn" href="index.html">
            Home
        </a>

        <button
            class="mobile-toggle"
            aria-label="Open menu"
            type="button">
            <span></span>
        </button>

    </div>

</header>


<main class="contact-page">

    <section class="contact-section">

        <div class="contact-intro">

            <p class="eyebrow">
                CONTACT
            </p>

            <h1>
                Get in touch
            </h1>

            <p class="intro-text">
                For bookings, concerts, collaborations or any other enquiry,
                please feel free to get in touch.
            </p>

        </div>


        <form
            id="contact-form"
            class="contact-form"
            novalidate>

            <div class="form-row">

                <div class="form-group">

                    <label for="nombre">
                        First name
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        autocomplete="given-name"
                        required>

                </div>


                <div class="form-group">

                    <label for="apellido">
                        Last name
                    </label>

                    <input
                        type="text"
                        id="apellido"
                        name="apellido"
                        autocomplete="family-name"
                        required>

                </div>

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    required>

            </div>


            <div class="form-group">

                <label for="mensaje">
                    Message
                </label>

                <textarea
                    id="mensaje"
                    name="mensaje"
                    rows="6"
                    required>
                </textarea>

            </div>


            <!-- Honeypot anti-spam -->
            <div class="hidden-field" aria-hidden="true">

                <label for="website">
                    Website
                </label>

                <input
                    type="text"
                    id="website"
                    name="website"
                    tabindex="-1"
                    autocomplete="off">

            </div>


            <button
                type="submit"
                class="send-btn"
                id="send-btn">

                <span class="btn-text">
                    Send message
                </span>

                <span
                    class="btn-loading"
                    aria-hidden="true">
                    Sending...
                </span>

            </button>


            <div
                id="form-message"
                class="form-message"
                role="status"
                aria-live="polite">
            </div>

        </form>

    </section>

</main>


<script>

const form = document.getElementById("contact-form");
const button = document.getElementById("send-btn");
const message = document.getElementById("form-message");

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzfWL9XxD3xpMV58ZstWS1wDZyF6WiRXsOxaoP_hRdpo3uMPl4r3LpuFWUWWQYoZLnriQ/exec";


form.addEventListener("submit", async function(event) {

    event.preventDefault();

    message.textContent = "";
    message.className = "form-message";


    /* Anti-spam */

    const website = document.getElementById("website").value;

    if (website.trim() !== "") {
        return;
    }


    /* Validación */

    if (!form.checkValidity()) {

        form.reportValidity();

        return;
    }


    button.disabled = true;
    button.classList.add("loading");


    const data = {

        nombre:
            document.getElementById("nombre").value.trim(),

        apellido:
            document.getElementById("apellido").value.trim(),

        email:
            document.getElementById("email").value.trim(),

        mensaje:
            document.getElementById("mensaje").value.trim()

    };


    try {

        await fetch(
            SCRIPT_URL,
            {
                method: "POST",

                mode: "no-cors",

                headers: {
                    "Content-Type": "text/plain;charset=utf-8"
                },

                body: JSON.stringify(data)
            }
        );


        form.reset();

        message.textContent =
            "Thank you. Your message has been sent successfully.";

        message.classList.add("success");


    } catch (error) {

        console.error(error);

        message.textContent =
            "Something went wrong. Please try again.";

        message.classList.add("error");

    }


    button.disabled = false;
    button.classList.remove("loading");

});

</script>

</body>
</html>
