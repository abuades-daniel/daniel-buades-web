<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Daniel Buades — Concerts</title>


  <!-- GOOGLE FONTS -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@400;500&family=Montserrat:wght@300;400;500&display=swap"
    rel="stylesheet"
  >


  <style>


    /* =========================================================
       GENERAL
    ========================================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    html {
      width: 100%;
      min-height: 100%;
      background: #080808;
    }


    body {
      width: 100%;
      min-height: 100vh;

      background: #080808;

      color: #fff;

      font-family: "Montserrat", Arial, sans-serif;

      overflow-x: hidden;
    }



    /* =========================================================
       CABECERA / MENÚ
    ========================================================= */

    .top-section {

      position: relative;

      width: 100%;

      min-height: 190px;

      background:
        linear-gradient(rgba(0,0,0,.10), rgba(0,0,0,.10)),
        url("img/foto-portada.jpg") center 35% / cover no-repeat;

      overflow: hidden;
    }


    .top-section::after {

      content: "";

      position: absolute;

      inset: 0;

      background: linear-gradient(
        90deg,
        rgba(0,0,0,.15) 0%,
        rgba(0,0,0,.03) 55%,
        rgba(0,0,0,.12) 100%
      );

      pointer-events: none;
    }



    /* =========================================================
       HEADER
    ========================================================= */

    header {

      position: relative;

      z-index: 50;

      width: 100%;

      height: 134px;

      display: flex;

      align-items: center;

      padding: 0 5.4% 0 3.9%;

      color: #fff;
    }


    .brand {

      flex: 0 0 auto;

      color: #fff;

      text-decoration: none;

      font-family: "Cormorant Garamond", Georgia, serif;

      font-size: 29px;

      font-weight: 400;

      line-height: 1;

      letter-spacing: -.6px;

      white-space: nowrap;
    }


    nav {

      display: flex;

      align-items: center;

      gap: 33px;

      margin-left: 54px;
    }


    nav a {

      position: relative;

      color: #fff;

      text-decoration: none;

      font-family: "Montserrat", Arial, sans-serif;

      font-size: 17px;

      font-weight: 400;

      line-height: 1;

      white-space: nowrap;

      transition: opacity .25s ease;
    }


    nav a:hover {
      opacity: .65;
    }


    nav a.active::after {

      content: "";

      position: absolute;

      left: 0;

      right: 0;

      bottom: -9px;

      height: 1px;

      background: rgba(255,255,255,.95);
    }



    /* =========================================================
       PARTE DERECHA
    ========================================================= */

    .header-right {

      margin-left: auto;

      display: flex;

      align-items: center;

      gap: 25px;
    }



    /* =========================================================
       REDES
    ========================================================= */

    .socials {

      display: flex;

      align-items: center;

      gap: 24px;

      margin-right: 22px;
    }


    .socials a {

      display: flex;

      align-items: center;

      justify-content: center;

      width: 25px;

      height: 25px;

      color: #fff;

      text-decoration: none;

      transition:
        transform .2s ease,
        opacity .2s ease;
    }


    .socials a:hover {

      transform: translateY(-2px);

      opacity: .7;
    }


    .socials svg {

      width: 23px;

      height: 23px;

      fill: none;

      stroke: currentColor;

      stroke-width: 1.8;
    }


    .socials .fill-icon {

      fill: currentColor;

      stroke: none;
    }



    /* =========================================================
       HOME
    ========================================================= */

    .home-btn {

      display: flex;

      align-items: center;

      justify-content: center;

      width: 118px;

      height: 75px;

      border: 1px solid rgba(255,255,255,.95);

      border-radius: 50%;

      color: #fff;

      text-decoration: none;

      font-family: "Cormorant Garamond", Georgia, serif;

      font-size: 21px;

      transition:
        background .25s ease,
        color .25s ease;
    }


    .home-btn:hover {

      background: rgba(255,255,255,.95);

      color: #111;
    }



    /* =========================================================
       BOTÓN MENÚ MÓVIL
    ========================================================= */

    .mobile-toggle {

      display: none;

      position: relative;

      width: 48px;

      height: 48px;

      border: 1px solid rgba(255,255,255,.8);

      border-radius: 50%;

      align-items: center;

      justify-content: center;

      color: white;

      background: transparent;

      cursor: pointer;
    }


    .mobile-toggle span,
    .mobile-toggle span::before,
    .mobile-toggle span::after {

      display: block;

      position: absolute;

      width: 19px;

      height: 1px;

      background: currentColor;

      content: "";
    }


    .mobile-toggle span::before {
      transform: translateY(-6px);
    }


    .mobile-toggle span::after {
      transform: translateY(6px);
    }



    /* =========================================================
       MENÚ MÓVIL
    ========================================================= */

    .mobile-menu {

      position: fixed;

      top: 95px;

      left: 0;

      width: 100%;

      z-index: 40;

      display: none;

      flex-direction: column;

      padding: 20px 25px 25px;

      background: rgba(8,8,8,.96);

      backdrop-filter: blur(10px);
    }


    .mobile-menu a {

      color: white;

      text-decoration: none;

      font-family: "Montserrat", Arial, sans-serif;

      font-size: 17px;

      padding: 14px 0;

      border-bottom: 1px solid rgba(255,255,255,.12);
    }


    .mobile-menu a:last-child {
      border-bottom: none;
    }


    .mobile-menu a.active {
      opacity: .65;
    }



    /* =========================================================
       TÍTULO
    ========================================================= */

    .page-title {

      position: relative;

      z-index: 5;

      text-align: center;

      padding: 15px 20px 25px;
    }


    .page-title h1 {

      color: #fff;

      font-family: "Allura", "Brush Script MT", cursive;

      font-size: clamp(52px, 5vw, 78px);

      font-weight: 400;

      line-height: .95;

      text-shadow: 0 1px 7px rgba(0,0,0,.25);
    }



    /* =========================================================
       CONCIERTOS
    ========================================================= */

    .concerts-section {

      position: relative;

      width: 100%;

      padding: 45px 5% 60px;

      background:
        linear-gradient(
          rgba(8,8,8,.96),
          rgba(8,8,8,.98)
        );
    }


    .concerts-container {

      max-width: 1200px;

      margin: 0 auto;
    }



    /* =========================================================
       PESTAÑAS
    ========================================================= */

    .tabs {

      display: flex;

      justify-content: center;

      align-items: center;

      gap: 12px;

      margin-bottom: 40px;
    }


    .tab {

      cursor: pointer;

      border: 1px solid rgba(255,255,255,.35);

      padding: 12px 24px;

      border-radius: 30px;

      background: transparent;

      color: #fff;

      font-family: "Montserrat", Arial, sans-serif;

      font-size: 14px;

      font-weight: 400;

      transition:
        background .25s ease,
        color .25s ease,
        border-color .25s ease;
    }


    .tab:hover {

      border-color: rgba(255,255,255,.8);
    }


    .tab.active {

      background: #fff;

      color: #111;

      border-color: #fff;
    }



    /* =========================================================
       GRID
    ========================================================= */

    .grid {

      display: grid;

      grid-template-columns:
        repeat(auto-fill, minmax(320px, 1fr));

      gap: 28px;

      align-items: start;
    }



    /* =========================================================
       TARJETAS
    ========================================================= */

    .card {

      background: #171717;

      border: 1px solid rgba(255,255,255,.08);

      border-radius: 3px;

      overflow: hidden;

      box-shadow:
        0 5px 20px rgba(0,0,0,.35);

      transition:
        transform .25s ease,
        box-shadow .25s ease;
    }


    .card:hover {

      transform: translateY(-4px);

      box-shadow:
        0 10px 30px rgba(0,0,0,.5);
    }



    /* =========================================================
       FOTO
    ========================================================= */

    .card-photo {

      display: block;

      width: 100%;

      height: 220px;

      object-fit: cover;

      background: #111;
    }



    /* =========================================================
       INFORMACIÓN
    ========================================================= */

    .info {

      padding: 22px;
    }


    .fecha {

      color: #c9a96e;

      font-family: "Montserrat", Arial, sans-serif;

      font-size: 13px;

      font-weight: 500;

      letter-spacing: .5px;

      margin-bottom: 12px;

      text-transform: uppercase;
    }


    .ciudad {

      color: #fff;

      font-family: "Cormorant Garamond", Georgia, serif;

      font-size: 31px;

      font-weight: 400;

      line-height: 1.08;

      margin-bottom: 10px;

      overflow-wrap: anywhere;
    }


    .sala {

      color: #bbb;

      font-size: 14px;

      font-weight: 300;

      line-height: 1.5;

      margin-bottom: 20px;

      white-space: pre-line;

      overflow-wrap: anywhere;
    }



    /* =========================================================
       TÍTULO DEL CONCIERTO
    ========================================================= */

    .concert-title {

      color: #fff;

      font-family: "Cormorant Garamond", Georgia, serif;

      font-size: 28px;

      font-weight: 400;

      line-height: 1.12;

      margin-top: 4px;

      margin-bottom: 20px;

      white-space: pre-line;

      overflow-wrap: anywhere;
    }



    /* =========================================================
       ENLACES
    ========================================================= */

    .links {

      display: flex;

      flex-wrap: wrap;

      gap: 10px;

      margin-top: 6px;
    }


    .boton {

      display: inline-flex;

      align-items: center;

      justify-content: center;

      text-decoration: none;

      background: transparent;

      color: #fff;

      border: 1px solid rgba(255,255,255,.65);

      padding: 10px 18px;

      border-radius: 30px;

      font-family: "Montserrat", Arial, sans-serif;

      font-size: 13px;

      line-height: 1.2;

      transition:
        background .25s ease,
        color .25s ease,
        border-color .25s ease;
    }


    .boton:hover {

      background: #fff;

      color: #111;

      border-color: #fff;
    }



    /* =========================================================
       CONCIERTO REALIZADO
    ========================================================= */

    .realizado {

      display: inline-block;

      background: transparent;

      color: #888;

      border: 1px solid #444;

      padding: 10px 18px;

      border-radius: 30px;

      font-size: 12px;
    }



    /* =========================================================
       MENSAJES
    ========================================================= */

    .oculto {
      display: none;
    }


    .mensaje {

      grid-column: 1 / -1;

      text-align: center;

      color: #888;

      font-size: 14px;

      padding: 50px 20px;
    }



    /* =========================================================
       FOOTER
    ========================================================= */

    footer {

      position: relative;

      width: 100%;

      padding: 20px 20px 30px;

      color: #666;

      font-size: 11px;

      text-align: center;

      background: #080808;
    }



    /* =========================================================
       RESPONSIVE
    ========================================================= */

    @media (max-width: 1250px) {

      header {

        padding-left: 3%;

        padding-right: 3%;
      }


      nav {

        gap: 21px;

        margin-left: 35px;
      }


      nav a {
        font-size: 15px;
      }


      .socials {

        gap: 15px;

        margin-right: 8px;
      }


      .header-right {
        gap: 12px;
      }


      .home-btn {

        width: 100px;

        height: 64px;

        font-size: 19px;
      }

    }



    @media (max-width: 980px) {

      .top-section {
        min-height: 150px;
      }


      header {

        height: 95px;

        padding: 24px 25px 0;

        align-items: center;
      }


      .brand {
        font-size: 26px;
      }


      nav,
      .socials {
        display: none;
      }


      .header-right {

        margin-left: auto;
      }


      .home-btn {

        width: 88px;

        height: 54px;

        font-size: 18px;
      }


      .mobile-toggle {
        display: flex;
      }


      .page-title {
        padding-top: 8px;
      }


      .concerts-section {

        padding-left: 4%;

        padding-right: 4%;
      }


      .grid {

        grid-template-columns:
          repeat(auto-fill, minmax(280px, 1fr));
      }

    }



    @media (max-width: 560px) {

      .top-section {

        min-height: 125px;

        background-position: 62% center;
      }


      header {

        height: 90px;

        padding: 20px 20px 0;
      }


      .brand {
        font-size: 24px;
      }


      .home-btn {
        display: none;
      }


      .mobile-toggle {

        width: 45px;

        height: 45px;
      }


      .mobile-menu {
        top: 90px;
      }


      .page-title {

        padding: 12px 15px 20px;
      }


      .page-title h1 {
        font-size: 58px;
      }


      .concerts-section {

        padding: 30px 18px 45px;
      }


      .tabs {

        gap: 8px;

        margin-bottom: 30px;
      }


      .tab {

        padding: 10px 16px;

        font-size: 12px;
      }


      .grid {

        grid-template-columns: 1fr;

        gap: 20px;
      }


      .card-photo {
        height: 210px;
      }


      .ciudad {
        font-size: 28px;
      }


      .concert-title {
        font-size: 26px;
      }

    }



    @media (max-width: 400px) {

      .brand {
        font-size: 24px;
      }

    }

  </style>

</head>

  <script>


    /* =======================================================
       GOOGLE SHEETS
    ======================================================== */

    const CSV_URL =
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vQT3WRJmZJrhXe_cdV5yy3sR9UchUccNSRkujL4M8xys56NvGQF2YueJkLzcVJSS6WL3pTkic5o7QhI/pub?gid=0&single=true&output=csv";



    /* =======================================================
       ESCAPAR HTML
    ======================================================== */

    function escaparHTML(texto) {

      return String(texto || "")

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");
    }



    /* =======================================================
       PARSER CSV CORRECTO
       
       Permite:
       - comas dentro de celdas
       - comillas
       - saltos de línea
    ======================================================== */

    function parseCSV(texto) {

      const filas = [];

      let fila = [];

      let campo = "";

      let dentroDeComillas = false;


      for (let i = 0; i < texto.length; i++) {

        const caracter = texto[i];

        const siguiente = texto[i + 1];


        if (caracter === '"' && dentroDeComillas && siguiente === '"') {

          campo += '"';

          i++;

          continue;
        }


        if (caracter === '"') {

          dentroDeComillas = !dentroDeComillas;

          continue;
        }


        if (caracter === "," && !dentroDeComillas) {

          fila.push(campo);

          campo = "";

          continue;
        }


        if (
          (caracter === "\n" || caracter === "\r") &&
          !dentroDeComillas
        ) {

          if (caracter === "\r" && siguiente === "\n") {
            i++;
          }

          fila.push(campo);

          campo = "";

          if (fila.some(c => c.trim() !== "")) {
            filas.push(fila);
          }

          fila = [];

          continue;
        }


        campo += caracter;
      }


      if (campo !== "" || fila.length > 0) {

        fila.push(campo);

        if (fila.some(c => c.trim() !== "")) {
          filas.push(fila);
        }
      }


      return filas;
    }



    /* =======================================================
       BUSCAR URLS
    ======================================================== */

    function extraerURLs(texto) {

      const regex =
        /https?:\/\/[^\s<>"']+/gi;

      return String(texto || "").match(regex) || [];
    }



    /* =======================================================
       QUITAR URLS DE UN TEXTO
    ======================================================== */

    function quitarURLs(texto) {

      return String(texto || "")

        .replace(
          /https?:\/\/[^\s<>"']+/gi,
          ""
        )

        .trim();
    }



    /* =======================================================
       LIMPIAR URL
    ======================================================== */

    function limpiarURL(url) {

      return String(url || "")

        .trim()

        .replace(/[),.;]+$/, "");
    }



    /* =======================================================
       COMPROBAR SI ES IMAGEN
    ======================================================== */

    function pareceImagen(url) {

      const valor =
        limpiarURL(url).toLowerCase();


      return (

        /\.(jpg|jpeg|png|gif|webp|avif|svg)(\?.*)?$/i.test(valor)

        ||

        valor.includes("images.unsplash.com")

        ||

        valor.includes("imagekit.io")

        ||

        valor.includes("cloudinary.com")

      );
    }



    /* =======================================================
       FORMATEAR FECHA
    ======================================================== */

    function formatearFecha(fecha) {

      if (!fecha) {
        return "";
      }


      const partes =
        String(fecha).trim().split("-");


      if (partes.length === 3) {

        const año = partes[0];

        const mes = partes[1];

        const dia = partes[2];


        const meses = [
          "JAN",
          "FEB",
          "MAR",
          "APR",
          "MAY",
          "JUN",
          "JUL",
          "AUG",
          "SEP",
          "OCT",
          "NOV",
          "DEC"
        ];


        const numeroMes =
          parseInt(mes, 10);


        if (
          numeroMes >= 1 &&
          numeroMes <= 12
        ) {

          return `${dia} ${meses[numeroMes - 1]} ${año}`;
        }
      }


      return escaparHTML(fecha);
    }



    /* =======================================================
       CREAR ENLACE
    ======================================================== */

    function crearBoton(url, texto) {

      const urlLimpia =
        limpiarURL(url);


      if (!urlLimpia) {
        return "";
      }


      return `

        <a
          class="boton"
          href="${escaparHTML(urlLimpia)}"
          target="_blank"
          rel="noopener noreferrer"
        >
          ${escaparHTML(texto)}
        </a>

      `;
    }



    /* =======================================================
       PROCESAR COLUMNA ENTRADAS
       
       Puede contener:

       1. Solo URL:
          https://entradas.com

       2. Texto + URL:
          Recital de Daniel Buades
          https://berklee.edu/...

    ======================================================== */

    function procesarEntradas(valor) {

      const texto =
        String(valor || "").trim();


      if (!texto) {

        return {
          titulo: "",
          botones: []
        };
      }


      const urls =
        extraerURLs(texto);


      const textoSinURLs =
        quitarURLs(texto).trim();


      const botones = [];


      urls.forEach((url, indice) => {

        if (indice === 0) {

          botones.push(
            crearBoton(
              url,
              textoSinURLs
                ? "More information"
                : "Tickets"
            )
          );

        } else {

          botones.push(
            crearBoton(
              url,
              "More information"
            )
          );

        }

      });


      return {

        titulo: textoSinURLs,

        botones

      };
    }



    /* =======================================================
       PROCESAR FOTO
       
       Si E contiene una URL de imagen:
       se muestra como imagen.

       Si E contiene otra URL y D ya tiene título:
       se interpreta como enlace de información.
    ======================================================== */

    function procesarFoto(
      foto,
      tieneTitulo
    ) {

      const valor =
        String(foto || "").trim();


      if (!valor) {

        return {
          imagen: "",
          enlace: ""
        };
      }


      const urls =
        extraerURLs(valor);


      if (!urls.length) {

        return {
          imagen: "",
          enlace: ""
        };
      }


      const url =
        limpiarURL(urls[0]);


      if (pareceImagen(url)) {

        return {

          imagen: `

            <img
              class="card-photo"
              src="${escaparHTML(url)}"
              alt="Concert"
              loading="lazy"
              onerror="this.style.display='none'"
            >

          `,

          enlace: ""

        };
      }


      /*
       Si no parece una imagen y la columna D
       contiene un título, consideramos que E
       es un enlace adicional.
      */

      if (tieneTitulo) {

        return {

          imagen: "",

          enlace:
            crearBoton(
              url,
              "More information"
            )

        };
      }


      return {

        imagen: "",

        enlace: ""

      };
    }



    /* =======================================================
       CREAR TARJETA
    ======================================================== */

    function crearTarjeta(concierto, esFuturo) {


      const entradas =
        procesarEntradas(
          concierto.entradas
        );


      const foto =
        procesarFoto(
          concierto.foto,
          Boolean(entradas.titulo)
        );


      let contenido = "";


      /*
       FOTO
      */

      contenido += foto.imagen;



      /*
       INFORMACIÓN
      */

      contenido += `

        <div class="info">

          <div class="fecha">
            ${formatearFecha(concierto.fecha)}
          </div>

          <div class="ciudad">
            ${escaparHTML(concierto.ciudad)}
          </div>

          ${
            concierto.sala
              ? `
                <div class="sala">
                  ${escaparHTML(concierto.sala)}
                </div>
              `
              : ""
          }

          ${
            entradas.titulo
              ? `
                <div class="concert-title">
                  ${escaparHTML(entradas.titulo)}
                </div>
              `
              : ""
          }

          <div class="links">

      `;


      /*
       ENLACES PARA CONCIERTOS FUTUROS
      */

      if (esFuturo) {

        entradas.botones.forEach(
          boton => {

            contenido += boton;

          }
        );


        if (foto.enlace) {

          contenido +=
            foto.enlace;

        }

      }


      /*
       CONCIERTOS PASADOS
      */

      else {

        contenido += `

          <span class="realizado">
            ✓ Concert completed
          </span>

        `;


        /*
         Si existe un enlace de información
         incluso en un concierto pasado,
         también lo mostramos.
        */

        if (foto.enlace) {

          contenido +=
            foto.enlace;

        }

      }


      contenido += `

          </div>

        </div>

      `;


      return `

        <article class="card">

          ${contenido}

        </article>

      `;
    }



    /* =======================================================
       CARGAR CONCIERTOS
    ======================================================== */

    async function cargarConciertos() {

      const futuros =
        document.getElementById("futuros");


      const pasados =
        document.getElementById("pasados");


      try {

        const respuesta =
          await fetch(CSV_URL);


        if (!respuesta.ok) {

          throw new Error(
            "Could not load Google Sheets"
          );

        }


        const csv =
          await respuesta.text();


        const filas =
          parseCSV(csv);


        /*
         La primera fila es la cabecera
        */

        const datos =
          filas.slice(1);


        const conciertos =
          datos

            .filter(
              fila =>
                fila.some(
                  celda =>
                    String(celda).trim() !== ""
                )
            )

            .map(fila => {

              return {

                fecha:
                  fila[0]?.trim() || "",

                ciudad:
                  fila[1]?.trim() || "",

                sala:
                  fila[2]?.trim() || "",

                entradas:
                  fila[3]?.trim() || "",

                foto:
                  fila[4]?.trim() || ""

              };

            });


        const hoy =
          new Date();


        hoy.setHours(
          0,
          0,
          0,
          0
        );


        let numFuturos = 0;

        let numPasados = 0;


        /*
         ORDENAR POR FECHA
        */

        conciertos.sort(
          (a, b) => {

            return (
              new Date(a.fecha) -
              new Date(b.fecha)
            );

          }
        );


        /*
         CREAR TARJETAS
        */

        conciertos.forEach(
          concierto => {


            if (!concierto.fecha) {
              return;
            }


            const fechaConcierto =
              new Date(concierto.fecha);


            fechaConcierto.setHours(
              0,
              0,
              0,
              0
            );


            const esFuturo =
              fechaConcierto >= hoy;


            const tarjeta =
              crearTarjeta(
                concierto,
                esFuturo
              );


            if (esFuturo) {

              futuros.insertAdjacentHTML(
                "beforeend",
                tarjeta
              );

              numFuturos++;

            } else {

              pasados.insertAdjacentHTML(
                "beforeend",
                tarjeta
              );

              numPasados++;

            }

          }
        );


        /*
         SI NO HAY FUTUROS
        */

        if (numFuturos === 0) {

          futuros.innerHTML = `

            <p class="mensaje">
              There are no concerts scheduled.
            </p>

          `;

        }


        /*
         SI NO HAY PASADOS
        */

        if (numPasados === 0) {

          pasados.innerHTML = `

            <p class="mensaje">
              There are no past concerts yet.
            </p>

          `;

        }

      }


      catch (error) {

        console.error(
          "Error loading concerts:",
          error
        );


        futuros.innerHTML = `

          <p class="mensaje">
            Error loading concerts.
          </p>

        `;

      }

    }



    /* =======================================================
       INICIAR
    ======================================================== */

    cargarConciertos();



    /* =======================================================
       PESTAÑAS
    ======================================================== */

    const btnFuturos =
      document.getElementById(
        "btnFuturos"
      );


    const btnPasados =
      document.getElementById(
        "btnPasados"
      );


    const futuros =
      document.getElementById(
        "futuros"
      );


    const pasados =
      document.getElementById(
        "pasados"
      );


    btnFuturos.onclick = () => {

      futuros.classList.remove(
        "oculto"
      );

      pasados.classList.add(
        "oculto"
      );


      btnFuturos.classList.add(
        "active"
      );

      btnPasados.classList.remove(
        "active"
      );

    };


    btnPasados.onclick = () => {

      futuros.classList.add(
        "oculto"
      );

      pasados.classList.remove(
        "oculto"
      );


      btnPasados.classList.add(
        "active"
      );

      btnFuturos.classList.remove(
        "active"
      );

    };



    /* =======================================================
       MENÚ MÓVIL
    ======================================================== */

    const mobileToggle =
      document.querySelector(
        ".mobile-toggle"
      );


    const mobileMenu =
      document.getElementById(
        "mobile-menu"
      );


    mobileToggle.addEventListener(
      "click",
      () => {


        const abierto =
          mobileToggle.getAttribute(
            "aria-expanded"
          ) === "true";


        mobileToggle.setAttribute(
          "aria-expanded",
          String(!abierto)
        );


        mobileMenu.style.display =
          abierto
            ? "none"
            : "flex";

      }
    );


  </script>
