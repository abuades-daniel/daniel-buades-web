<h1>Concerts</h1>

<div class="tabs">

<button class="tab active" id="btnFuturos">
Upcoming concerts
</button>

<button class="tab" id="btnPasados">
Past concerts
</button>

</div>

<div class="contenedor">

<div id="futuros" class="grid"></div>

<div id="pasados" class="grid oculto"></div>

</div>

<script>

const CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vQT3WRJmZJrhXe_cdV5yy3sR9UchUccNSRkujL4M8xys56NvGQF2YueJkLzcVJSS6WL3pTkic5o7QhI/pub?gid=0&single=true&output=csv";

async function cargarConciertos(){

try{

const respuesta = await fetch(CSV_URL);
const csv = await respuesta.text();

const filas = csv.trim().split("\n").slice(1);

const conciertos = filas.map(fila => {

const columnas = fila.split(",");

return {
fecha: columnas[0]?.trim(),
ciudad: columnas[1]?.trim(),
sala: columnas[2]?.trim(),
entradas: columnas[3]?.trim(),
foto: columnas[4]?.trim()
};

});

const futuros = document.getElementById("futuros");
const pasados = document.getElementById("pasados");

const hoy = new Date();

let numFuturos = 0;
let numPasados = 0;

conciertos
.sort((a,b)=>new Date(a.fecha)-new Date(b.fecha))
.forEach(c => {

const fechaConcierto = new Date(c.fecha);
const esFuturo = fechaConcierto >= hoy;

const accion = esFuturo
? `
${c.entradas}
Buy tickets
</a>
`
: `
<span class="realizado">
✓ Concert performed
</span>
`;

const tarjeta = `
<div class="card">

<img
<div class="info">

<div class="fecha">
${c.fecha}
</div>

<div class="ciudad">
${c.ciudad}
</div>

<div class="sala">
${c.sala}
</div>

${accion}

</div>

</div>
`;

if(esFuturo){
futuros.innerHTML += tarjeta;
numFuturos++;
}else{
pasados.innerHTML += tarjeta;
numPasados++;
}

});

if(numFuturos===0){
futuros.innerHTML =
'<p class="mensaje">No upcoming concerts.</p>';
}

if(numPasados===0){
pasados.innerHTML =
'<p class="mensaje">No past concerts.</p>';
}

}catch(error){

console.error(error);

document.getElementById("futuros").innerHTML =
'<p class="mensaje">Error loading concerts.</p>';

}

}

cargarConciertos();

const btnFuturos =
document.getElementById("btnFuturos");

const btnPasados =
document.getElementById("btnPasados");

const futuros =
document.getElementById("futuros");

const pasados =
document.getElementById("pasados");

btnFuturos.onclick = () => {

futuros.classList.remove("oculto");
pasados.classList.add("oculto");

btnFuturos.classList.add("active");
btnPasados.classList.remove("active");

};

btnPasados.onclick = () => {

futuros.classList.add("oculto");
pasados.classList.remove("oculto");

btnPasados.classList.add("active");
btnFuturos.classList.remove("active");

};

</script>
