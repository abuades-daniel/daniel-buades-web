<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mis Conciertos</title>

<style>

body{
margin:0;
background:#111;
color:white;
font-family:Arial,sans-serif;
}

header{
text-align:center;
padding:30px;
}

h1{
margin:0;
}

.tabs{
display:flex;
justify-content:center;
gap:10px;
margin-bottom:25px;
}

.tab{
cursor:pointer;
border:none;
padding:12px 20px;
border-radius:8px;
background:#333;
color:white;
font-size:16px;
}

.tab.active{
background:#e63946;
}

.contenedor{
max-width:1200px;
margin:auto;
padding:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
gap:20px;
}

.card{
background:#1e1e1e;
border-radius:12px;
overflow:hidden;
box-shadow:0 3px 10px rgba(0,0,0,0.4);
}

.card img{
width:100%;
height:220px;
object-fit:cover;
}

.info{
padding:15px;
}

.fecha{
color:#fcbf49;
font-weight:bold;
margin-bottom:10px;
}

.ciudad{
font-size:22px;
margin-bottom:5px;
}

.sala{
color:#ddd;
margin-bottom:15px;
}

.boton{
display:inline-block;
text-decoration:none;
background:#e63946;
color:white;
padding:10px 15px;
border-radius:6px;
}

.oculto{
display:none;
}

</style>
</head>
<body>

<header>
<h1>🎸 Agenda de Conciertos</h1>
</header>

<div class="tabs">
<button class="tab active" id="btnFuturos">
Próximos conciertos
</button>

<button class="tab" id="btnPasados">
Conciertos pasados
</button>
</div>

<div class="contenedor">

<div id="futuros" class="grid"></div>

<div id="pasados" class="grid oculto"></div>

</div>

<script>

// PEGA AQUÍ TU URL CSV DE GOOGLE SHEETS

const CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vQT3WRJmZJrhXe_cdV5yy3sR9UchUccNSRkujL4M8xys56NvGQF2YueJkLzcVJSS6WL3pTkic5o7QhI/pub?gid=0&single=true&output=csv";

async function cargarConciertos(){

const respuesta = await fetch(CSV_URL);
const csv = await respuesta.text();

const filas = csv.trim().split("\n").slice(1);

const conciertos = filas.map(fila => {

const columnas = fila.split(",");

return {
fecha: columnas[0],
ciudad: columnas[1],
sala: columnas[2],
entradas: columnas[3],
foto: columnas[4]
};
});

const futuros = document.getElementById("futuros");
const pasados = document.getElementById("pasados");

const hoy = new Date();

conciertos.forEach(c => {

const fechaConcierto = new Date(c.fecha);

const tarjeta = `
<div class="card">

${c.foto}

<div class="info">

<div class="fecha">
${c.fecha}
</div>

<div class="ciudad">
${c.ciudad}
</div>

<div class="sala">
${c.sala}
</div>

${c.entradas}
Comprar entradas
</a>

</div>

</div>
`;

if(fechaConcierto >= hoy){
futuros.innerHTML += tarjeta;
}else{
pasados.innerHTML += tarjeta;
}

});

}

cargarConciertos();

const btnFuturos = document.getElementById("btnFuturos");
const btnPasados = document.getElementById("btnPasados");

btnFuturos.onclick = () => {

futuros.classList.remove("oculto");
pasados.classList.add("oculto");

btnFuturos.classList.add("active");
btnPasados.classList.remove("active");
};

btnPasados.onclick = () => {

futuros.classList.add("oculto");
pasados.classList.remove("oculto");

btnPasados.classList.add("active");
btnFuturos.classList.remove("active");
};

</script>

</body>
</html>
