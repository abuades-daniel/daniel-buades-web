<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Agenda de Conciertos</title>

<style>

body{
margin:0;
background:#111;
color:white;
font-family:Arial,sans-serif;
}

header{
text-align:center;
padding:30px;
}

h1{
margin:0;
}

.tabs{
display:flex;
justify-content:center;
gap:10px;
margin-bottom:25px;
}

.tab{
cursor:pointer;
border:none;
padding:12px 20px;
border-radius:8px;
background:#333;
color:white;
font-size:16px;
}

.tab.active{
background:#e63946;
}

.contenedor{
max-width:1200px;
margin:auto;
padding:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
gap:20px;
}

.card{
background:#1e1e1e;
border-radius:12px;
overflow:hidden;
box-shadow:0 3px 10px rgba(0,0,0,0.4);
}

.card img{
width:100%;
height:220px;
object-fit:cover;
}

.info{
padding:15px;
}

.fecha{
color:#fcbf49;
font-weight:bold;
margin-bottom:10px;
}

.ciudad{
font-size:22px;
margin-bottom:5px;
}

.sala{
color:#ddd;
margin-bottom:15px;
}

.boton{
display:inline-block;
text-decoration:none;
background:#e63946;
color:white;
padding:10px 15px;
border-radius:6px;
}

.boton:hover{
background:#d62839;
}

.realizado{
display:inline-block;
background:#444;
color:#ddd;
padding:10px 15px;
border-radius:6px;
font-size:14px;
}

.oculto{
display:none;
}

.mensaje{
text-align:center;
color:#ccc;
margin-top:30px;
}

</style>
</head>
<body>

<header>
<h1>🎵 Agenda de Conciertos</h1>
</header>

<div class="tabs">
<button class="tab active" id="btnFuturos">
Próximos conciertos
</button>

<button class="tab" id="btnPasados">
Conciertos pasados
</button>
</div>

<div class="contenedor">

<div id="futuros" class="grid"></div>

<div id="pasados" class="grid oculto"></div>

</div>

<script>

// =============================
// PEGA AQUÍ TU URL DE GOOGLE SHEETS
// =============================

const CSV_URL =
"https://docs.google.com/spreadsheets/d/e/TU_ID/pub?output=csv";

async function cargarConciertos(){

try{

const respuesta = await fetch(CSV_URL);
const csv = await respuesta.text();

const filas = csv.trim().split("\n").slice(1);

const conciertos = filas.map(fila => {

const columnas = fila.split(",");

return {
fecha: columnas[0]?.trim(),
ciudad: columnas[1]?.trim(),
sala: columnas[2]?.trim(),
entradas: columnas[3]?.trim(),
foto: columnas[4]?.trim()
};
});

const futuros = document.getElementById("futuros");
const pasados = document.getElementById("pasados");

const hoy = new Date();

let numFuturos = 0;
let numPasados = 0;

conciertos
.sort((a,b) => new Date(a.fecha) - new Date(b.fecha))
.forEach(c => {

const fechaConcierto = new Date(c.fecha);
const esFuturo = fechaConcierto >= hoy;

const accion = esFuturo
? `
${c.entradas}
Comprar entradas
</a>
`
: `
<span class="realizado">
✓ Concierto realizado
</span>
`;

const tarjeta = `
<div class="card">

${c.foto}

<div class="info">

<div class="fecha">
${c.fecha}
</div>

<div class="ciudad">
${c.ciudad}
</div>

<div class="sala">
${c.sala}
</div>

${accion}

</div>

</div>
`;

if(esFuturo){
futuros.innerHTML += tarjeta;
numFuturos++;
}else{
pasados.innerHTML += tarjeta;
numPasados++;
}

});

if(numFuturos === 0){
futuros.innerHTML =
'<p class="mensaje">No hay conciertos programados.</p>';
}

if(numPasados === 0){
pasados.innerHTML =
'<p class="mensaje">Todavía no hay conciertos pasados.</p>';
}

}catch(error){

console.error(error);

document.getElementById("futuros").innerHTML =
'<p class="mensaje">Error cargando los conciertos.</p>';
}
}

cargarConciertos();

const btnPasados = document.getElementById("btnPasados");
