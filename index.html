<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daniel Buades — Drummer & Composer</title>

  <!-- Similar typography to the original site -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@400;500&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080808;
    }

    body {
      color: #fff;
      font-family: "Montserrat", Arial, sans-serif;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 620px;
      overflow: hidden;
      background:
        linear-gradient(rgba(0,0,0,.08), rgba(0,0,0,.08)),
        url("img/foto-portada.jpg") center center / cover no-repeat;
    }

    /* Very subtle darkening, matching the moody original */
    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        90deg,
        rgba(0,0,0,.10) 0%,
        rgba(0,0,0,.02) 55%,
        rgba(0,0,0,.08) 100%
      );
      pointer-events: none;
    }

    /* ---------- HEADER ---------- */

    header {
      position: absolute;
      z-index: 10;
      top: 0;
      left: 0;
      width: 100%;
      height: 134px;
      display: flex;
      align-items: center;
      padding: 0 5.4% 0 3.9%;
    }

    .brand {
      flex: 0 0 auto;
      color: #fff;
      text-decoration: none;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 29px;
      line-height: 1;
      letter-spacing: -.6px;
      white-space: nowrap;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 33px;
      margin-left: 54px;
    }

    nav a {
      position: relative;
      color: #fff;
      text-decoration: none;
      font-family: "Montserrat", Arial, sans-serif;
      font-size: 17px;
      font-weight: 400;
      line-height: 1;
      white-space: nowrap;
      transition: opacity .25s ease;
    }

    nav a:hover {
      opacity: .65;
    }

    .header-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 25px;
    }

    .socials {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-right: 22px;
      transform: translateY(0);
    }

    .socials a {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      width: 25px;
      height: 25px;
      text-decoration: none;
      transition: transform .2s ease, opacity .2s ease;
    }

    .socials a:hover {
      transform: translateY(-2px);
      opacity: .7;
    }

    .socials svg {
      width: 23px;
      height: 23px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
    }

    .socials .fill-icon {
      fill: currentColor;
      stroke: none;
    }

    .home-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 118px;
      height: 75px;
      border: 1px solid rgba(255,255,255,.95);
      border-radius: 50%;
      color: #fff;
      text-decoration: none;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 21px;
      transition: background .25s ease, color .25s ease;
    }

    .home-btn:hover {
      background: rgba(255,255,255,.95);
      color: #111;
    }

    /* ---------- HERO TEXT ---------- */

    .hero-copy {
      position: absolute;
      z-index: 5;
      left: 8.2%;
      top: 27.3%;
      width: 560px;
    }

    .hero-copy h1 {
      color: #fff;
      font-family: "Allura", "Brush Script MT", cursive;
      font-size: clamp(68px, 5.1vw, 91px);
      font-weight: 400;
      line-height: .95;
      letter-spacing: 1px;
      text-shadow: 0 1px 7px rgba(0,0,0,.12);
    }

    .hero-copy p {
      margin-top: 35px;
      margin-left: 11.5%;
      color: #fff;
      font-family: "Montserrat", Arial, sans-serif;
      font-size: clamp(23px, 1.7vw, 31px);
      font-weight: 300;
      line-height: 1;
      white-space: nowrap;
    }

    /* ---------- RESPONSIVE ---------- */

    .mobile-toggle {
      display: none;
    }

    @media (max-width: 1250px) {
      header {
        padding-left: 3%;
        padding-right: 3%;
      }

      nav {
        gap: 21px;
        margin-left: 35px;
      }

      nav a {
        font-size: 15px;
      }

      .socials {
        gap: 15px;
        margin-right: 8px;
      }

      .header-right {
        gap: 12px;
      }

      .home-btn {
        width: 100px;
        height: 64px;
        font-size: 19px;
      }
    }

    @media (max-width: 980px) {
      html, body {
        overflow: auto;
      }

      .hero {
        min-height: 700px;
        height: 100vh;
      }

      header {
        height: 95px;
        padding: 24px 25px 0;
        align-items: center;
      }

      .brand {
        font-size: 26px;
      }

      nav,
      .socials {
        display: none;
      }

      .header-right {
        margin-left: auto;
      }

      .mobile-toggle {
        display: flex;
        width: 48px;
        height: 48px;
        border: 1px solid rgba(255,255,255,.8);
        border-radius: 50%;
        align-items: center;
        justify-content: center;
        color: white;
        background: transparent;
        cursor: pointer;
      }

      .mobile-toggle span,
      .mobile-toggle span::before,
      .mobile-toggle span::after {
        display: block;
        width: 19px;
        height: 1px;
        background: currentColor;
        content: "";
        position: absolute;
      }

      .mobile-toggle span::before { transform: translateY(-6px); }
      .mobile-toggle span::after  { transform: translateY(6px); }

      .home-btn {
        width: 88px;
        height: 54px;
        font-size: 18px;
      }

      .hero-copy {
        left: 7%;
        top: 30%;
        width: 86%;
      }

      .hero-copy h1 {
        font-size: clamp(60px, 12vw, 90px);
      }

      .hero-copy p {
        margin-left: 5%;
        margin-top: 28px;
        font-size: clamp(19px, 4vw, 27px);
      }
    }

    @media (max-width: 560px) {
      .hero {
        background-position: 62% center;
      }

      .home-btn {
        display: none;
      }

      .hero-copy {
        top: 34%;
      }

      .hero-copy h1 {
        font-size: 65px;
      }

      .hero-copy p {
        margin-left: 0;
        margin-top: 25px;
        font-size: 19px;
      }
    }
/* ---------- MOBILE MENU ---------- */

.mobile-menu {
  display: none;
}

@media (max-width: 980px) {
  .mobile-menu {
    position: fixed;
    z-index: 20;
    top: 95px;
    left: 20px;
    right: 20px;

    padding: 30px 25px;

    background: rgba(8, 8, 8, .94);
    border: 1px solid rgba(255,255,255,.25);

    flex-direction: column;
    gap: 24px;

    opacity: 0;
    visibility: hidden;
    transform: translateY(-10px);
    transition:
      opacity .25s ease,
      transform .25s ease,
      visibility .25s ease;
  }

  .mobile-menu.open {
    display: flex;
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }

  .mobile-menu a {
    color: #fff;
    text-decoration: none;
    font-family: "Montserrat", Arial, sans-serif;
    font-size: 18px;
    font-weight: 300;
  }

  .mobile-menu a:hover {
    opacity: .6;
  }

  /* Animación del botón hamburguesa */

  .mobile-toggle span {
    transition: background .2s ease;
  }

  .mobile-toggle span::before,
  .mobile-toggle span::after {
    transition: transform .25s ease;
  }

  .mobile-toggle.open span {
    background: transparent;
  }

  .mobile-toggle.open span::before {
    transform: rotate(45deg);
  }

  .mobile-toggle.open span::after {
    transform: rotate(-45deg);
  }
}

  </style>
</head>

<body>
  <main class="hero">

    <header>
      <a class="brand" href="#home">Daniel Buades</a>

      <nav aria-label="Main navigation">
        <a href="biography.html">Biography</a>
        <a href="videos.html">Videos</a>
        <a href="gallery.html">Gallery</a>
        <a href="concerts.html">Concerts</a>
        <a href="contact.html">Contact</a>
      </nav>

      <div class="header-right">
        <div class="socials" aria-label="Social networks">

          <!-- Instagram -->
          <a href="#" aria-label="Instagram">
            <svg viewBox="0 0 24 24">
              <rect x="3.2" y="3.2" width="17.6" height="17.6" rx="5"></rect>
              <circle cx="12" cy="12" r="4.1"></circle>
              <circle class="fill-icon" cx="17.5" cy="6.7" r="1.1"></circle>
            </svg>
          </a>

          <!-- Spotify -->
          <a href="#" aria-label="Spotify">
            <svg class="fill-icon" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="11"></circle>
              <path d="M7 9.1c3.8-1.1 7.5-.8 10.5.4" stroke="#111" stroke-width="1.5" fill="none" stroke-linecap="round"></path>
              <path d="M7.7 12c3.1-.8 6.3-.5 8.8.5" stroke="#111" stroke-width="1.5" fill="none" stroke-linecap="round"></path>
              <path d="M8.5 14.8c2.4-.5 4.8-.3 6.7.5" stroke="#111" stroke-width="1.5" fill="none" stroke-linecap="round"></path>
            </svg>
          </a>

          <!-- Facebook -->
          <a href="#" aria-label="Facebook">
            <svg class="fill-icon" viewBox="0 0 24 24">
              <path d="M13.8 21v-8h2.7l.4-3h-3.1V8.1c0-.9.3-1.5 1.6-1.5h1.7V3.9c-.3 0-1.3-.1-2.4-.1-2.4 0-4.1 1.5-4.1 4.2V10H8v3h2.6v8h3.2z"></path>
            </svg>
          </a>

          <!-- YouTube -->
          <a href="#" aria-label="YouTube">
            <svg class="fill-icon" viewBox="0 0 24 24">
              <path d="M22 7.2c-.2-1.1-1.1-2-2.2-2.2C18 4.7 15.1 4.5 12 4.5s-6 .2-7.8.5C3.1 5.2 2.2 6.1 2 7.2c-.3 1.5-.4 3-.4 4.8s.1 3.3.4 4.8c.2 1.1 1.1 2 2.2 2.2 1.8.3 4.7.5 7.8.5s6-.2 7.8-.5c1.1-.2 2-1.1 2.2-2.2.3-1.5.4-3 .4-4.8s-.1-3.3-.4-4.8zM10 15.5v-7l6 3.5-6 3.5z"></path>
            </svg>
          </a>

        </div>

        <a class="home-btn" href="#home">Home</a>

        <button class="mobile-toggle" aria-label="Open menu">
          <span></span>
        </button>
      </div>
    </header>

    <section class="hero-copy" id="home">
      <h1>Daniel Buades</h1>
      <p>Drummer - Composer</p>
    </section>

  </main>
<script>
  const toggle = document.querySelector(".mobile-toggle");
  const menu = document.querySelector("#mobile-menu");

  toggle.addEventListener("click", () => {
    const isOpen = menu.classList.toggle("open");

    toggle.classList.toggle("open", isOpen);

    toggle.setAttribute("aria-expanded", isOpen);
    toggle.setAttribute(
      "aria-label",
      isOpen ? "Close menu" : "Open menu"
    );
  });

  // Cerrar el menú al pulsar un enlace
  menu.querySelectorAll("a").forEach(link => {
    link.addEventListener("click", () => {
      menu.classList.remove("open");
      toggle.classList.remove("open");
      toggle.setAttribute("aria-expanded", "false");
      toggle.setAttribute("aria-label", "Open menu");
    });
  });
</script>

</body>
</html>
