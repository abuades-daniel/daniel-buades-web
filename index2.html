<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daniel Buades | Web Oficial</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    font-family:Arial, sans-serif;

    background:
    linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.55)),
    url("img/daniel-buades.jpg");

    background-size:cover;
    background-position:center;
    background-attachment:fixed;

    color:white;
}

.container{
    max-width:800px;
    padding:40px;
}

h1{
    font-size:4rem;
    letter-spacing:4px;
    margin-bottom:20px;
}

.subtitle{
    font-size:1.5rem;
    color:#d4af37;
    margin-bottom:30px;
}

.message{
    font-size:1.2rem;
    line-height:1.8;
    color:#e5e5e5;
}

.social{
    margin-top:40px;
}

.social a{
    color:white;
    text-decoration:none;
    margin:0 15px;
    font-size:1.1rem;
}

.social a:hover{
    color:#d4af37;
}

footer{
    position:absolute;
    bottom:20px;
    width:100%;
    color:#ccc;
    font-size:0.9rem;
}
</style>
</head>

<body>

<div class="container">

    <h1>DANIEL BUADES</h1>

    <div class="subtitle">
        Jazz Drummer
    </div>

    <div class="message">
        La nueva web oficial está actualmente en construcción.<br>
        Muy pronto estará disponible con información sobre proyectos,
        grabaciones, conciertos, galería y contacto.
    </div>

    <div class="social">
        #>
        #
        #
    </div>

</div>

<footer>
    © 2026 Daniel Buades. Todos los derechos reservados.
</footer>

</body>
</html>
