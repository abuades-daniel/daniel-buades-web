<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gallery — Daniel Buades | Drummer & Composer</title>
    <meta name="description" content="Explore photos and gallery of Daniel Buades, drummer and composer.">

    <!-- TIPOGRAFÍAS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@400;500&family=Montserrat:wght@300;400&display=swap"
        rel="stylesheet"
    >

    <style>

        /* =========================================================
           RESET
        ========================================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            width: 100%;
            min-height: 100%;
            background: #080808;
            color: #fff;
            font-family: "Montserrat", Arial, sans-serif;
            overflow-x: hidden;
        }


        /* =========================================================
           HEADER
           EXACTAMENTE IGUAL AL DE LA PÁGINA INICIAL
        ========================================================= */

        header {
            position: absolute;
            z-index: 50;

            top: 0;
            left: 0;

            width: 100%;
            height: 134px;

            display: flex;
            align-items: center;

            padding: 0 5.4% 0 3.9%;

            color: #fff;
        }


        /* =========================================================
           LOGO
        ========================================================= */

        .brand {
            flex: 0 0 auto;

            color: #fff;
            text-decoration: none;

            font-family: "Cormorant Garamond", Georgia, serif;

            font-size: 29px;
            font-weight: 400;

            line-height: 1;

            letter-spacing: -.6px;

            white-space: nowrap;
        }


        /* =========================================================
           NAVEGACIÓN
        ========================================================= */

        nav {
            display: flex;
            align-items: center;

            gap: 33px;

            margin-left: 54px;
        }

        nav a {
            position: relative;

            color: #fff;
            text-decoration: none;

            font-family: "Montserrat", Arial, sans-serif;

            font-size: 17px;
            font-weight: 400;

            line-height: 1;

            white-space: nowrap;

            transition: opacity .25s ease;
        }

        nav a:hover {
            opacity: .65;
        }


        /* =========================================================
           PÁGINA ACTIVA
           
           SOLO LA PÁGINA ACTUAL TIENE SUBRAYADO
        ========================================================= */

        nav a.active::after {
            content: "";

            position: absolute;

            left: 0;
            right: 0;

            bottom: -9px;

            height: 1px;

            background: rgba(255,255,255,.95);
        }


        /* =========================================================
           PARTE DERECHA
        ========================================================= */

        .header-right {
            margin-left: auto;

            display: flex;
            align-items: center;

            gap: 25px;
        }


        /* =========================================================
           REDES SOCIALES
        ========================================================= */

        .socials {
            display: flex;
            align-items: center;

            gap: 24px;

            margin-right: 22px;
        }

        .socials a {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 25px;
            height: 25px;

            color: #fff;

            text-decoration: none;

            transition:
                transform .2s ease,
                opacity .2s ease;
        }

        .socials a:hover {
            transform: translateY(-2px);
            opacity: .7;
        }

        .socials svg {
            width: 23px;
            height: 23px;

            fill: none;

            stroke: currentColor;
            stroke-width: 1.8;
        }

        .socials .fill-icon {
            fill: currentColor;
            stroke: none;
        }


        /* =========================================================
           BOTÓN HOME
        ========================================================= */

        .home-btn {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 118px;
            height: 75px;

            border: 1px solid rgba(255,255,255,.95);

            border-radius: 50%;

            color: #fff;
            text-decoration: none;

            font-family: "Cormorant Garamond", Georgia, serif;

            font-size: 21px;

            transition:
                background .25s ease,
                color .25s ease;
        }

        .home-btn:hover {
            background: rgba(255,255,255,.95);
            color: #111;
        }


        /* =========================================================
           MENÚ MÓVIL
        ========================================================= */

        .mobile-toggle {
            display: none;

            position: relative;

            width: 48px;
            height: 48px;

            border: 1px solid rgba(255,255,255,.8);

            border-radius: 50%;

            align-items: center;
            justify-content: center;

            color: white;
            background: transparent;

            cursor: pointer;
        }

        .mobile-toggle span,
        .mobile-toggle span::before,
        .mobile-toggle span::after {
            display: block;

            position: absolute;

            width: 19px;
            height: 1px;

            background: currentColor;

            content: "";
        }

        .mobile-toggle span::before {
            transform: translateY(-6px);
        }

        .mobile-toggle span::after {
            transform: translateY(6px);
        }


        /* =========================================================
           MENÚ MÓVIL DESPLEGABLE
        ========================================================= */

        .mobile-menu {
            position: fixed;

            top: 95px;
            left: 0;

            width: 100%;

            z-index: 40;

            display: none;

            flex-direction: column;

            padding: 20px 25px 25px;

            background: rgba(8,8,8,.96);

            backdrop-filter: blur(10px);
        }

        .mobile-menu a {
            color: white;
            text-decoration: none;

            font-family: "Montserrat", Arial, sans-serif;

            font-size: 17px;

            padding: 14px 0;

            border-bottom: 1px solid rgba(255,255,255,.12);
        }

        .mobile-menu a:last-child {
            border-bottom: none;
        }

        .mobile-menu a.active {
            opacity: .65;
        }


        /* =========================================================
           HERO / CABECERA DE GALLERY
        ========================================================= */

        .hero {
            position: relative;

            width: 100%;
            height: 365px;

            overflow: hidden;

            display: flex;
            align-items: flex-end;

            padding: 0 8.2% 70px;

            background:
                linear-gradient(
                    rgba(5,10,12,.12),
                    rgba(5,10,12,.12)
                ),
                url("./img/videos-bg.jpg")
                center center / cover no-repeat;
        }

        .hero::after {
            content: "";

            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    90deg,
                    rgba(0,0,0,.10) 0%,
                    rgba(0,0,0,.02) 55%,
                    rgba(0,0,0,.08) 100%
                );

            pointer-events: none;
        }

        .hero-content {
            position: relative;

            z-index: 5;
        }

        .hero h1 {
            color: #fff;

            font-family: "Cormorant Garamond", Georgia, serif;

            font-size: 52px;
            font-weight: 400;

            font-style: italic;

            line-height: 1;

            letter-spacing: 1px;
        }


        /* =========================================================
           GALERÍA
        ========================================================= */

        .gallery {
            width: 100%;

            display: flex;
            align-items: flex-start;

            background: #090b0c;
        }

        .gallery-column {
            width: 50%;

            display: flex;
            flex-direction: column;
        }

        .photo {
            position: relative;

            width: 100%;

            overflow: hidden;

            cursor: pointer;
        }

        .photo img {
            display: block;

            width: 100%;
            height: auto;

            transition:
                transform .5s ease,
                filter .5s ease;
        }

        .photo:hover img {
            transform: scale(1.03);

            filter: brightness(.7);
        }


        /* =========================================================
           OVERLAY
        ========================================================= */

        .photo-overlay {
            position: absolute;
            inset: 0;

            display: flex;
            align-items: flex-end;

            padding: 25px;

            background:
                linear-gradient(
                    transparent 45%,
                    rgba(0,0,0,.7)
                );

            opacity: 0;

            transition: opacity .4s ease;
        }

        .photo:hover .photo-overlay {
            opacity: 1;
        }

        .photo-title {
            font-family: "Cormorant Garamond", serif;

            font-size: 25px;

            font-style: italic;
        }


        /* =========================================================
           FOOTER
        ========================================================= */

        footer {
            min-height: 150px;

            width: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 40px 46px;

            background: #080a0b;

            border-top: 1px solid rgba(255,255,255,.08);

            color: rgba(255,255,255,.5);

            font-size: 11px;

            text-align: center;
        }


        /* =========================================================
           LIGHTBOX
        ========================================================= */

        .lightbox {
            position: fixed;

            inset: 0;

            z-index: 100;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 40px;

            background: rgba(0,0,0,.92);

            opacity: 0;
            visibility: hidden;

            transition: opacity .3s ease;
        }

        .lightbox.active {
            opacity: 1;
            visibility: visible;
        }

        .lightbox img {
            max-width: 92vw;
            max-height: 88vh;

            object-fit: contain;

            box-shadow:
                0 20px 80px rgba(0,0,0,.6);
        }

        .close {
            position: absolute;

            top: 25px;
            right: 35px;

            border: 0;

            color: white;
            background: none;

            font-size: 30px;
            font-weight: 200;

            cursor: pointer;
        }


        /* =========================================================
           RESPONSIVE
        ========================================================= */

        @media (max-width: 1250px) {

            header {
                padding-left: 3%;
                padding-right: 3%;
            }

            nav {
                gap: 21px;
                margin-left: 35px;
            }

            nav a {
                font-size: 15px;
            }

            .socials {
                gap: 15px;
                margin-right: 8px;
            }

            .header-right {
                gap: 12px;
            }

            .home-btn {
                width: 100px;
                height: 64px;

                font-size: 19px;
            }
        }


        @media (max-width: 980px) {

            header {
                height: 95px;

                padding: 24px 25px 0;

                align-items: center;
            }

            .brand {
                font-size: 26px;
            }

            nav,
            .socials {
                display: none;
            }

            .header-right {
                margin-left: auto;
            }

            .home-btn {
                width: 88px;
                height: 54px;

                font-size: 18px;
            }

            .mobile-toggle {
                display: flex;
            }

            .hero {
                height: 330px;

                padding:
                    0
                    7%
                    60px;
            }

            .hero h1 {
                font-size: 48px;
            }
        }


        @media (max-width: 560px) {

            header {
                height: 90px;

                padding:
                    20px 20px 0;
            }

            .brand {
                font-size: 24px;
            }

            .home-btn {
                display: none;
            }

            .mobile-toggle {
                width: 45px;
                height: 45px;
            }

            .mobile-menu {
                top: 90px;
            }

            .hero {
                height: 300px;

                padding:
                    0
                    7%
                    45px;
            }

            .hero h1 {
                font-size: 44px;
            }

            .gallery {
                flex-direction: column;
            }

            .gallery-column {
                width: 100%;
            }

            footer {
                min-height: 130px;

                padding:
                    30px 20px;
            }
        }

    </style>
</head>

========================================================= -->

<div
    class="lightbox"
    id="lightbox">

    <button
        class="close"
        id="close"
        aria-label="Close image">

        ×

    </button>

    <img
        id="lightboxImage"
        src=""
        alt="">

</div>


<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script>

    /* =========================
       LIGHTBOX
    ========================= */

    const photos =
        document.querySelectorAll(".photo img");

    const lightbox =
        document.getElementById("lightbox");

    const lightboxImage =
        document.getElementById("lightboxImage");

    const close =
        document.getElementById("close");


    photos.forEach(photo => {

        photo.addEventListener("click", () => {

            lightboxImage.src =
                photo.src;

            lightboxImage.alt =
                photo.alt;

            lightbox.classList.add("active");

        });

    });


    close.addEventListener("click", () => {

        lightbox.classList.remove("active");

    });


    lightbox.addEventListener("click", event => {

        if (event.target === lightbox) {

            lightbox.classList.remove("active");

        }

    });


    document.addEventListener("keydown", event => {

        if (event.key === "Escape") {

            lightbox.classList.remove("active");

        }

    });


    /* =========================
       MENÚ MÓVIL
    ========================= */

    const mobileToggle =
        document.querySelector(".mobile-toggle");

    const mobileMenu =
        document.getElementById("mobile-menu");


    mobileToggle.addEventListener("click", () => {

        const abierto =
            mobileToggle.getAttribute("aria-expanded") === "true";

        mobileToggle.setAttribute(
            "aria-expanded",
            String(!abierto)
        );

        mobileMenu.style.display =
            abierto ? "none" : "flex";

    });

</script>
