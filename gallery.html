    <style>

/* =========================================================
   RESET / GENERAL
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    width: 100%;
    min-height: 100%;
    background: #080808;
    scroll-behavior: smooth;
}

body {
    width: 100%;
    min-height: 100vh;
    background: #080808;
    color: #fff;
    font-family: "Montserrat", Arial, sans-serif;
    overflow-x: hidden;
}


/* =========================================================
   CABECERA COMPLETA
   IGUAL QUE CONCERTS
========================================================= */

.top-section {

    position: relative;

    width: 100%;

    min-height: 130px;

    background:
        linear-gradient(
            rgba(0,0,0,.10),
            rgba(0,0,0,.10)
        ),
        url("img/foto-portada.jpg")
        center 98% / cover no-repeat;

    overflow: hidden;
}


.top-section::after {

    content: "";

    position: absolute;

    inset: 0;

    background: linear-gradient(
        90deg,
        rgba(0,0,0,.15) 0%,
        rgba(0,0,0,.03) 55%,
        rgba(0,0,0,.12) 100%
    );

    pointer-events: none;
}


/* =========================================================
   HEADER
========================================================= */

header {

    position: relative;

    z-index: 50;

    width: 100%;

    height: 134px;

    display: flex;

    align-items: center;

    padding: 0 5.4% 0 3.9%;

    color: #fff;
}


/* =========================================================
   LOGO
========================================================= */

.brand {

    flex: 0 0 auto;

    color: #fff;

    text-decoration: none;

    font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

    font-size: 29px;

    font-weight: 400;

    line-height: 1;

    letter-spacing: -.6px;

    white-space: nowrap;
}


/* =========================================================
   NAVEGACIÓN
========================================================= */

nav {

    display: flex;

    align-items: center;

    gap: 33px;

    margin-left: 54px;
}


nav a {

    position: relative;

    color: #fff;

    text-decoration: none;

    font-family:
        "Montserrat",
        Arial,
        sans-serif;

    font-size: 17px;

    font-weight: 400;

    line-height: 1;

    white-space: nowrap;

    transition: opacity .25s ease;
}


nav a:hover {
    opacity: .65;
}


nav a.active::after {

    content: "";

    position: absolute;

    left: 0;
    right: 0;

    bottom: -9px;

    height: 1px;

    background:
        rgba(255,255,255,.95);
}


/* =========================================================
   PARTE DERECHA
========================================================= */

.header-right {

    margin-left: auto;

    display: flex;

    align-items: center;

    gap: 25px;
}


/* =========================================================
   REDES
========================================================= */

.socials {

    display: flex;

    align-items: center;

    gap: 24px;

    margin-right: 22px;
}


.socials a {

    display: flex;

    align-items: center;

    justify-content: center;

    width: 25px;

    height: 25px;

    color: #fff;

    text-decoration: none;

    transition:
        transform .2s ease,
        opacity .2s ease;
}


.socials a:hover {

    transform: translateY(-2px);

    opacity: .7;
}


.socials svg {

    width: 23px;

    height: 23px;

    fill: none;

    stroke: currentColor;

    stroke-width: 1.8;
}


.socials .fill-icon {

    fill: currentColor;

    stroke: none;
}


/* =========================================================
   HOME
========================================================= */

.home-btn {

    display: flex;

    align-items: center;

    justify-content: center;

    width: 118px;

    height: 75px;

    border: 1px solid rgba(255,255,255,.95);

    border-radius: 50%;

    color: #fff;

    text-decoration: none;

    font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

    font-size: 21px;

    transition:
        background .25s ease,
        color .25s ease;
}


.home-btn:hover {

    background:
        rgba(255,255,255,.95);

    color: #111;
}


/* =========================================================
   BOTÓN MENÚ MÓVIL
========================================================= */

.mobile-toggle {

    display: none;

    position: relative;

    width: 48px;

    height: 48px;

    border:
        1px solid rgba(255,255,255,.8);

    border-radius: 50%;

    align-items: center;

    justify-content: center;

    color: white;

    background: transparent;

    cursor: pointer;
}


.mobile-toggle span,
.mobile-toggle span::before,
.mobile-toggle span::after {

    display: block;

    position: absolute;

    width: 19px;

    height: 1px;

    background: currentColor;

    content: "";
}


.mobile-toggle span::before {
    transform: translateY(-6px);
}


.mobile-toggle span::after {
    transform: translateY(6px);
}


/* =========================================================
   MENÚ MÓVIL
========================================================= */

.mobile-menu {

    position: fixed;

    top: 95px;

    left: 0;

    width: 100%;

    z-index: 40;

    display: none;

    flex-direction: column;

    padding: 20px 25px 25px;

    background:
        rgba(8,8,8,.96);

    backdrop-filter: blur(10px);
}


.mobile-menu a {

    color: white;

    text-decoration: none;

    font-family:
        "Montserrat",
        Arial,
        sans-serif;

    font-size: 17px;

    padding: 14px 0;

    border-bottom:
        1px solid rgba(255,255,255,.12);
}


.mobile-menu a:last-child {
    border-bottom: none;
}


.mobile-menu a.active {
    opacity: .65;
}


/* =========================================================
   TÍTULO
   IGUAL QUE CONCERTS
========================================================= */

    position: relative;

    z-index: 5;

    text-align: center;

    padding:
        15px 20px 25px;

    background: #080808;
}


.page-title h1 {

    color: #fff;

    font-family:
        "Allura",
        "Brush Script MT",
        cursive;

    font-size:
        clamp(52px, 5vw, 78px);

    font-weight: 400;

    line-height: .95;

    text-shadow:
        0 1px 7px rgba(0,0,0,.25);
}


/* =========================================================
   GALERÍA
========================================================= */

/* =========================================================
   GALERÍA
========================================================= */

.gallery {

    width: 100%;

    display: flex;

    align-items: flex-start;

    background: #080808;

    /*
       Franja negra a izquierda y derecha.
       El 4% hace que el margen sea elegante
       sin quitar demasiado protagonismo a las fotos.
    */
    padding: 0 4%;
}


.gallery-column {

    width: 50%;

    display: flex;

    flex-direction: column;
}


.photo {

    position: relative;

    width: 100%;

    overflow: hidden;

    cursor: pointer;
}


.photo img {

    display: block;

    width: 100%;

    height: auto;

    transition:
        transform .5s ease,
        filter .5s ease;
}


.photo:hover img {

    transform: scale(1.03);

    filter: brightness(.7);
}



/* =========================================================
   OVERLAY
========================================================= */

.photo-overlay {

    position: absolute;

    inset: 0;

    display: flex;

    align-items: flex-end;

    padding: 25px;

    background:
        linear-gradient(
            transparent 45%,
            rgba(0,0,0,.7)
        );

    opacity: 0;

    transition: opacity .4s ease;
}


.photo:hover .photo-overlay {
    opacity: 1;
}


.photo-title {

    font-family:
        "Cormorant Garamond",
        serif;

    font-size: 25px;

    font-style: italic;
}


/* =========================================================
   FOOTER
========================================================= */

footer {

    min-height: 150px;

    width: 100%;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 40px 46px;

    background: #080a0b;

    border-top:
        1px solid rgba(255,255,255,.08);

    color:
        rgba(255,255,255,.5);

    font-size: 11px;

    text-align: center;
}


/* =========================================================
   LIGHTBOX
========================================================= */

.lightbox {

    position: fixed;

    inset: 0;

    z-index: 100;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 40px;

    background:
        rgba(0,0,0,.92);

    opacity: 0;

    visibility: hidden;

    transition: opacity .3s ease;
}


.lightbox.active {

    opacity: 1;

    visibility: visible;
}


.lightbox img {

    max-width: 92vw;

    max-height: 88vh;

    object-fit: contain;

    box-shadow:
        0 20px 80px rgba(0,0,0,.6);
}


.close {

    position: absolute;

    top: 25px;

    right: 35px;

    border: 0;

    color: white;

    background: none;

    font-size: 30px;

    font-weight: 200;

    cursor: pointer;
}


/* =========================================================
   RESPONSIVE
   IGUAL QUE CONCERTS
========================================================= */

@media (max-width: 1250px) {

    }

        margin-right: 8px;
    }

    }


    .home-btn {

        height: 64px;

    }

@media (max-width: 980px) {

    .mobile-toggle {
        display: flex;
    }


    .page-title {
        padding-top: 8px;
    }


    .gallery {

    }

    }
}


@media (max-width: 560px) {

    .top-section {

    }

        padding:

    }

    .home-btn {

    }


    .mobile-toggle {

        width: 45px;

    }


    .mobile-menu {
        top: 90px;
    }

        padding:

    }


    .gallery-column {
        width: 100%;
    }


    footer {

        min-height: 130px;

        padding:
            30px 20px;
    }
}


@media (max-width: 400px) {

    .brand {
        font-size: 24px;
    }
}

    </style>

========================================================= -->

<div
    class="lightbox"
    id="lightbox">

    <button
        class="close"
        id="close"
        aria-label="Close image">

        ×

    </button>

    <img
        id="lightboxImage"
        src=""
        alt="">

</div>


<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script>

    /* =========================
       LIGHTBOX
    ========================= */

    const photos =
        document.querySelectorAll(".photo img");

    const lightbox =
        document.getElementById("lightbox");

    const lightboxImage =
        document.getElementById("lightboxImage");

    const close =
        document.getElementById("close");


    photos.forEach(photo => {

        photo.addEventListener("click", () => {

            lightboxImage.src =
                photo.src;

            lightboxImage.alt =
                photo.alt;

            lightbox.classList.add("active");

        });

    });


    close.addEventListener("click", () => {

        lightbox.classList.remove("active");

    });


    lightbox.addEventListener("click", event => {

        if (event.target === lightbox) {

            lightbox.classList.remove("active");

        }

    });


    document.addEventListener("keydown", event => {

        if (event.key === "Escape") {

            lightbox.classList.remove("active");

        }

    });


    /* =========================
       MENÚ MÓVIL
    ========================= */

    const mobileToggle =
        document.querySelector(".mobile-toggle");

    const mobileMenu =
        document.getElementById("mobile-menu");


    mobileToggle.addEventListener("click", () => {

        const abierto =
            mobileToggle.getAttribute("aria-expanded") === "true";

        mobileToggle.setAttribute(
            "aria-expanded",
            String(!abierto)
        );

        mobileMenu.style.display =
            abierto ? "none" : "flex";

    });

</script>
