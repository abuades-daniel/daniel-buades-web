<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daniel Buades — Gallery</title>

    <!-- Tipografías -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #080b0c;
            color: #fff;
            font-family: "Inter", sans-serif;
            overflow-x: hidden;
        }

/* =========================
   HEADER
========================= */

header {
    position: absolute;
    top: 0;
    left: 0;

    width: 100%;
    height: 92px;

    z-index: 50;

    display: flex;
    align-items: center;

    padding: 0 48px;

    box-sizing: border-box;

    color: #fff;
}


/* =========================
   LOGO
========================= */

.brand {
    flex-shrink: 0;

    color: #fff;
    text-decoration: none;

    font-family: Georgia, "Times New Roman", serif;

    font-size: 25px;
    font-weight: 400;

    line-height: 1;

    white-space: nowrap;
}


/* =========================
   NAVEGACIÓN
========================= */

nav {
    display: flex;
    align-items: center;

    gap: 32px;

    margin-left: 55px;
}

nav a {
    position: relative;

    color: rgba(255, 255, 255, .95);

    text-decoration: none;

    font-family: "Inter", Arial, sans-serif;

    font-size: 16px;
    font-weight: 400;

    line-height: 1;

    white-space: nowrap;

    transition:
        opacity .25s ease,
        color .25s ease;
}

nav a:hover {
    opacity: .55;
}


nav a.active {
    color: #fff;
}


/* Página activa */

nav a.active::after {
    content: "";

    position: absolute;

    left: 0;
    right: 0;
    bottom: -7px;

    height: 1px;

    background: #fff;

    opacity: .9;
}

/* =========================
   PARTE DERECHA
========================= */

.header-right {
    margin-left: auto;

    display: flex;
    align-items: center;

    gap: 28px;
}


/* =========================
   REDES SOCIALES
========================= */

.socials {
    display: flex;
    align-items: center;

    gap: 16px;
}

.socials a {
    width: 22px;
    height: 22px;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #fff;

    text-decoration: none;

    opacity: .95;

    transition:
        opacity .25s ease,
        transform .25s ease;
}

.socials a:hover {
    opacity: .55;
    transform: translateY(-1px);
}

.socials svg {
    width: 19px;
    height: 19px;

    display: block;

    fill: none;

    stroke: #fff;

    stroke-width: 1.5;
}


/* Iconos rellenos */

.socials svg.fill-icon,
.socials svg.facebook,
.socials svg.youtube {
    stroke: none;
    fill: #fff;
}


/* Spotify */

.socials .spotify {
    stroke: none;
}


/* =========================
   BOTÓN HOME
========================= */

.home-btn {
    width: 82px;
    height: 40px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 1px solid rgba(255, 255, 255, .75);

    border-radius: 22px;

    color: #fff;

    text-decoration: none;

    font-family: "Inter", Arial, sans-serif;

    font-size: 14px;
    font-weight: 400;

    transition:
        background .3s ease,
        color .3s ease;
}

.home-btn:hover {
    background: #fff;
    color: #111;
}


/* =========================
   RESPONSIVE
========================= */

@media (max-width: 1200px) {

    header {
        padding: 0 35px;
    }

    .brand {
        font-size: 23px;
    }

    nav {
        gap: 24px;
        margin-left: 40px;
    }

    nav a {
        font-size: 15px;
    }

    .socials {
        gap: 13px;
    }

    .socials a {
        width: 21px;
        height: 21px;
    }

    .socials svg {
        width: 18px;
        height: 18px;
    }
}


/* =========================
   TABLET / MOBILE
========================= */

@media (max-width: 900px) {

    header {
        height: 78px;
        padding: 0 25px;
    }

    .brand {
        font-size: 22px;
    }

    nav {
        display: none;
    }

    .socials {
        display: none;
    }

    .home-btn {
        display: none;
    }

    .mobile-toggle {
        display: flex;
    }
}


/* =========================
   TABLET
========================= */

@media (max-width: 1100px) {

    header {
        padding-left: 40px;
        padding-right: 40px;
    }

    nav {
        gap: 23px;
        margin-left: 30px;
    }

    nav a {
        font-size: 10px;
    }

    .header-right {
        gap: 23px;
    }

    .socials {
        gap: 18px;
    }
}


/* =========================
   MÓVIL
========================= */

@media (max-width: 850px) {

    header {
        height: 70px;
        padding: 0 24px;
    }

    nav {
        display: none;
    }

    .header-right {
        gap: 18px;
    }

    .socials {
        gap: 16px;
    }

    .home-btn {
        width: 57px;
        height: 36px;
    }
}


@media (max-width: 500px) {

    header {
        padding: 0 20px;
    }

    .brand {
        font-size: 13px;
    }

    .socials {
        gap: 13px;
    }

    .socials a {
        width: 12px;
        height: 12px;
    }

    .socials svg {
        width: 12px;
        height: 12px;
    }

    .home-btn {
        display: none;
    }
}



        /* =========================
           HERO
        ========================= */

.hero {
    height: 365px;

    position: relative;
    overflow: hidden;

    display: flex;
    align-items: flex-end;

    padding: 0 46px 137px;

    background-image:
        linear-gradient(
            rgba(5, 10, 12, .10),
            rgba(5, 10, 12, .10)
        ),
        url("./img/fondo-gallery.png");

    background-size: cover;
    background-position: center;
}

.hero-content {
    position: relative;
    z-index: 5;
}

.hero h1 {
    margin: 0;

    color: #fff;

    font-family: "Cormorant Garamond", serif;

    font-size: 52px;
    font-weight: 400;

    font-style: italic;

    letter-spacing: 2px;
}


        /* =========================
           GALERÍA
        ========================= */

.gallery {
    width: 100%;
    display: flex;
    align-items: flex-start;
    gap: 0;
    background: #090b0c;
}

.gallery-column {
    width: 50%;
    display: flex;
    flex-direction: column;
}

.photo {
    position: relative;
    width: 100%;
    overflow: hidden;
    cursor: pointer;
}

.photo img {
    width: 100%;
    height: auto;
    display: block;
}

.photo:hover img {
    transform: scale(1.03);
    filter: brightness(.7);
}

        .photo-overlay {
            position: absolute;
            inset: 0;

            display: flex;
            align-items: flex-end;

            padding: 25px;

            background:
                linear-gradient(
                    transparent 45%,
                    rgba(0,0,0,.7)
                );

            opacity: 0;
            transition: .4s;
        }

        .photo:hover .photo-overlay {
            opacity: 1;
        }

        .photo-title {
            font-family: "Cormorant Garamond", serif;
            font-size: 25px;
            font-style: italic;
        }

        /* Foto 3 grande */
/*
        .photo:nth-child(3) {
            grid-column: 1 / 3;
            height: 480px;
        }
*/
        /* =========================
           FOOTER
        ========================= */

        footer {
            min-height: 180px;
            background: #080a0b;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 40px 46px;

            border-top: 1px solid rgba(255,255,255,.08);
        }

        footer .footer-name {
            font-family: Georgia, serif;
            font-size: 14px;
        }

        footer p {
            color: rgba(255,255,255,.5);
            font-size: 11px;
        }

        /* =========================
           LIGHTBOX
        ========================= */

        .lightbox {
            position: fixed;
            inset: 0;
            z-index: 100;

            background: rgba(0,0,0,.92);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 40px;

            opacity: 0;
            visibility: hidden;

            transition: .3s;
        }

        .lightbox.active {
            opacity: 1;
            visibility: visible;
        }

        .lightbox img {
            max-width: 92vw;
            max-height: 88vh;
            object-fit: contain;

            box-shadow: 0 20px 80px rgba(0,0,0,.6);
        }

        .close {
            position: absolute;
            top: 25px;
            right: 35px;

            color: white;
            background: none;
            border: 0;

            font-size: 30px;
            font-weight: 200;

            cursor: pointer;
        }


        /* =========================
           RESPONSIVE
        ========================= */

    @media (max-width: 1250px) {
      header { padding-left: 3%; padding-right: 3%; }
      nav { gap: 21px; margin-left: 35px; }
      nav a { font-size: 15px; }
      .socials { gap: 15px; margin-right: 8px; }
      .header-right { gap: 12px; }
      .home-btn { width: 100px; height: 64px; font-size: 19px; }
      .video-grid { column-gap: 28px; }
    }

    @media (max-width: 980px) {
      header {
        height: 95px;
        padding: 24px 25px 0;
        align-items: center;
      }
      .brand { font-size: 26px; }
      nav, .socials { display: none; }
      .header-right { margin-left: auto; }
      .mobile-toggle {
        display: flex;
        width: 48px;
        height: 48px;
        border: 1px solid rgba(255,255,255,.8);
        border-radius: 50%;
        align-items: center;
        justify-content: center;
        background: transparent;
      }


        @media (max-width: 850px) {

            header {
                padding: 0 22px;
            }

            nav {
                display: none;
            }

            .socials {
                gap: 15px;
            }

            .home-button {
                display: none;
            }

            .hero {
                height: 330px;
                padding: 0 28px 70px;
            }

            .gallery {
                grid-template-columns: 1fr;
            }

            .photo {
                height: 300px;
            }

            .photo:nth-child(3) {
                grid-column: auto;
                height: 300px;
            }

            footer {
                padding: 35px 25px;
                flex-direction: column;
                gap: 20px;
                align-items: flex-start;
            }
        }

        @media (max-width: 500px) {

            .socials a:nth-child(n+3) {
                display: none;
            }

            .hero {
                height: 300px;
            }

            .hero h1 {
                font-size: 48px;
            }

            .photo {
                height: 270px;
            }
        }
    </style>
</head>


<body>
<header>

    <a class="brand" href="index.html">
        Daniel Buades
    </a>

    <nav aria-label="Main navigation">
        <a href="biography.html">Biography</a>
        <a href="videos.html">Videos</a>
        <a href="gallery.html" class="active">Gallery</a>
        <a href="concerts.html">Concerts</a>
        <a href="contact.html">Contact</a>
        <a href="epk.html">EPK</a>
    </nav>

    <div class="header-right">

        <div class="socials">

            <!-- Instagram -->
            <a href="#" aria-label="Instagram">
                <svg viewBox="0 0 24 24">
                    <rect x="3.5" y="3.5"
                          width="17" height="17"
                          rx="4.5"></rect>

                    <circle cx="12" cy="12" r="4"></circle>

                    <circle class="fill-icon"
                            cx="17.5"
                            cy="6.7"
                            r="1.1"></circle>
                </svg>
            </a>

            <!-- Spotify -->
            <a href="#" aria-label="Spotify">
                <svg class="spotify" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10"></circle>

                    <path d="M7 9.3c3.4-1 7.2-.8 10.2.4"
                          stroke="#111"
                          stroke-width="1.5"
                          fill="none"
                          stroke-linecap="round"></path>

                    <path d="M7.5 12.1c3-.8 6.3-.6 8.9.4"
                          stroke="#111"
                          stroke-width="1.5"
                          fill="none"
                          stroke-linecap="round"></path>

                    <path d="M8.3 14.8c2.3-.5 4.7-.3 6.6.5"
                          stroke="#111"
                          stroke-width="1.5"
                          fill="none"
                          stroke-linecap="round"></path>
                </svg>
            </a>

            <!-- Facebook -->
            <a href="#" aria-label="Facebook">
                <svg class="facebook" viewBox="0 0 24 24">
                    <path d="M13.7 21v-8h2.7l.4-3h-3.1V8.1
                             c0-.9.3-1.5 1.6-1.5h1.7V3.9
                             c-.3 0-1.3-.1-2.4-.1
                             -2.4 0-4.1 1.5-4.1 4.2V10H8v3h2.5v8z">
                    </path>
                </svg>
            </a>

            <!-- YouTube -->
            <a href="#" aria-label="YouTube">
                <svg class="youtube" viewBox="0 0 24 24">
                    <path d="M21.8 7.3c-.2-1-1-1.8-2-2
                             -1.8-.4-4.7-.6-7.8-.6
                             -3.1 0-6 .2-7.8.6
                             -1 .2-1.8 1-2 2
                             -.3 1.4-.4 3-.4 4.7
                             0 1.7.1 3.3.4 4.7
                             .2 1 1 1.8 2 2
                             1.8.4 4.7.6 7.8.6
                             3.1 0 6-.2 7.8-.6
                             1-.2 1.8-1 2-2
                             .3-1.4.4-3 .4-4.7
                             0-1.7-.1-3.3-.4-4.7z">
                    </path>

                    <path d="M10 15.5v-7l6 3.5z"
                          fill="#111">
                    </path>
                </svg>
            </a>

        </div>

        <a class="home-btn" href="index.html">
            Home
        </a>

    </div>

</header>


    <!-- =========================
         CABECERA
    ========================= -->

    <section class="hero">

        <div class="hero-content">
            <h1>Gallery</h1>
        </div>

    </section>


    <!-- =========================
         GALERÍA — 6 FOTOS
    ========================= -->

<section class="gallery">

    <div class="gallery-column">

        <div class="photo">
            <img src="img/foto1.webp" alt="Fotografía 1">
        </div>

        <div class="photo">
            <img src="img/foto4.webp" alt="Fotografía 4">
        </div>

        <div class="photo">
            <img src="img/foto5.webp" alt="Fotografía 5">
        </div>

    </div>


    <div class="gallery-column">

        <div class="photo">
            <img src="img/foto2.webp" alt="Fotografía 2">
        </div>

        <div class="photo">
            <img src="img/foto3.webp" alt="Fotografía 3">
        </div>

        <div class="photo">
            <img src="img/foto6.webp" alt="Fotografía 6">
        </div>

    </div>

</section>



    <!-- =========================
         FOOTER
    ========================= -->

    <footer>

        <div class="footer-name">
            Daniel Buades
        </div>

        <p>
            © 2026 — All rights reserved
        </p>

    </footer>


    <!-- =========================
         LIGHTBOX
    ========================= -->

    <div class="lightbox" id="lightbox">

        <button class="close" id="close">
            ×
        </button>

        <img id="lightboxImage" src="" alt="">

    </div>


    <script>

        const photos = document.querySelectorAll(".photo img");
        const lightbox = document.getElementById("lightbox");
        const lightboxImage = document.getElementById("lightboxImage");
        const close = document.getElementById("close");

        photos.forEach(photo => {

            photo.addEventListener("click", () => {

                lightboxImage.src = photo.src;
                lightboxImage.alt = photo.alt;

                lightbox.classList.add("active");

            });

        });

        close.addEventListener("click", () => {
            lightbox.classList.remove("active");
        });

        lightbox.addEventListener("click", (e) => {

            if (e.target === lightbox) {
                lightbox.classList.remove("active");
            }

        });

        document.addEventListener("keydown", (e) => {

            if (e.key === "Escape") {
                lightbox.classList.remove("active");
            }

        });

    </script>

</body>
</html>
